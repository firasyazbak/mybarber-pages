<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're In — MyBarber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
   * Colors mirror the app's own Material 3 scheme: ColorScheme.fromSeed
   * with seedColor 0xFF8B5E34 (lib/core/theme/app_theme.dart). Keep these
   * two blocks in sync if that seed color ever changes.
   */
  :root {
    --surface: #fff8f5;
    --card: #f5e5db;
    --on-surface: #221a14;
    --on-surface-variant: #51443a;
    --primary: #87521b;
    --on-primary: #ffffff;
    --ring: rgba(135, 82, 27, 0.35);
    --outline-variant: #d6c3b6;
    --badge-bg: rgba(135, 82, 27, 0.14);
    --hairline: rgba(34, 26, 20, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #19120c;
      --card: #312822;
      --on-surface: #efe0d5;
      --on-surface-variant: #d6c3b6;
      --primary: #ffb878;
      --on-primary: #4b2700;
      --ring: rgba(255, 184, 120, 0.4);
      --outline-variant: #51443a;
      --badge-bg: rgba(255, 184, 120, 0.16);
      --hairline: rgba(239, 224, 213, 0.14);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: "Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 15%, var(--hairline) 0, transparent 45%),
      radial-gradient(circle at 85% 85%, var(--hairline) 0, transparent 45%);
    background-repeat: no-repeat;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--outline-variant);
    border-radius: 10px;
    padding: 44px 32px 36px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  .mark {
    font-family: "Fraunces", Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--primary);
    margin: 0 0 28px;
  }

  .badge {
    width: 60px;
    height: 60px;
    margin: 0 auto 24px;
    border-radius: 999px;
    background: var(--badge-bg);
    border: 1.5px solid var(--ring);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: settle 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .badge svg {
    width: 26px;
    height: 26px;
    stroke: var(--primary);
  }

  @media (prefers-reduced-motion: reduce) {
    .badge { animation: none; }
  }

  @keyframes settle {
    from { opacity: 0; transform: scale(0.75); }
    to { opacity: 1; transform: scale(1); }
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.25;
    margin: 0 0 10px;
    text-wrap: balance;
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--on-surface-variant);
    margin: 0;
    text-wrap: balance;
  }

  .rule {
    width: 32px;
    height: 1px;
    background: var(--hairline);
    margin: 24px auto;
  }

  .fine {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="mark">MyBarber</p>
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Your email is confirmed</h1>
    <p>The account's ready to go. You can close this tab now and head back to the app to sign in.</p>
    <div class="rule"></div>
    <p class="fine">This page is just a receipt — nothing more to do here.</p>
  </div>
</body>
</html>
